# Build distributable artifacts: wheels per (OS, arch) plus the sdist.
#
# `abi3-py311` is what keeps this small — a single cp311-abi3 wheel serves every
# Python 3.11+, so there is no Python axis, only platforms.
#
# COST. This is a private repo, so runner minutes are metered with per-OS
# multipliers: linux x1, windows x2, macOS x10. A full six-job matrix bills
# ~195 minutes, ~160 of it the two macOS jobs. So the full matrix runs only where
# it is actually load-bearing — a release tag — and everything else defaults to
# the linux-only `scope`, which bills ~19.
#
# Triggers, deliberately narrow:
#   workflow_dispatch  the button; pick `linux` or `full` by hand
#   workflow_call      release.yml passes scope=full
# There is intentionally NO push trigger. Pushing to main costs nothing; when you
# want a cross-platform check, press the button.
#
# A `pull_request` trigger existed (linux scope, filtered to packaging and
# compiled code) and was removed on 2026-08-21: every build is now something you
# asked for by name. The cost is that `workflow_dispatch` is read from the
# DEFAULT BRANCH, so a change to this file cannot be exercised until it is
# merged — there is no longer a pre-merge path that runs it.
name: Build

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Which targets to build"
        type: choice
        options: [linux, full]
        default: linux
  workflow_call:
    inputs:
      scope:
        type: string
        default: full

permissions: {}

concurrency:
  # Serialize runs on a ref without killing any: every run is now deliberate
  # (a dispatch or a release), and cancelling one would only waste the minutes
  # already spent. This was `github.event_name == 'pull_request'`, which can no
  # longer be true.
  group: wheels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Selects the matrix so the expensive targets are opt-in. Both remaining
  # triggers supply `scope` (dispatch defaults to linux, workflow_call to full),
  # so the `|| 'linux'` fallback is now belt-and-braces rather than load-bearing.
  setup:
    name: Select targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          SCOPE: ${{ inputs.scope || 'linux' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os

          # manylinux 2_28 rather than the runner's own glibc: building on the
          # host would stamp whatever it happens to have (2_34) into the tag and
          # needlessly exclude older distros.
          linux = [
              {"name": "linux-x86_64", "runner": "ubuntu-latest", "target": "x86_64",
               "manylinux": "2_28", "smoke": True},
              # Cross-compiled in a container, so the runner cannot execute the
              # result — the only target without a smoke test.
              {"name": "linux-aarch64", "runner": "ubuntu-latest", "target": "aarch64",
               "manylinux": "2_28", "smoke": False},
          ]
          rest = [
              {"name": "macos-arm64", "runner": "macos-14", "target": "aarch64-apple-darwin",
               "manylinux": "auto", "smoke": True},
              {"name": "macos-x86_64", "runner": "macos-13", "target": "x86_64-apple-darwin",
               "manylinux": "auto", "smoke": True},
              {"name": "windows-x64", "runner": "windows-latest", "target": "x64",
               "manylinux": "auto", "smoke": True},
          ]

          scope = os.environ["SCOPE"]
          include = linux + rest if scope == "full" else linux
          print(f"matrix={json.dumps({'include': include})}")
          PY

  wheel:
    name: ${{ matrix.name }}
    needs: setup
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
          sccache: "true"

      # A wheel that builds but cannot be imported is the failure this matrix
      # exists to catch, so install from the wheel — not the source tree — and run
      # the suite against the artifact that would actually ship.
      - name: Smoke-test the wheel
        if: matrix.smoke
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl pytest
          python -c "import bartons; from bartons.indicators import EMA; print('import ok')"
          python -m pytest -q

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.name }}
          path: dist/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The fallback for platforms with no wheel. Installing from it needs a Rust
      # toolchain on the user's machine, which pyproject cannot declare — hence
      # the wheel matrix above.
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # The sdist is the artifact most likely to break silently: it ships only
      # what the packaging config selects, so a file left out still compiles here
      # and fails on a stranger's machine. Installing it exercises the real path
      # — cargo builds the extension from the included sources — which no wheel
      # job covers and `twine check` cannot see, validating only metadata.
      #
      # The suite comes from the checkout, not the sdist, which ships no tests.
      # It still exercises the *installed* build: pyproject sets
      # `python-source = "python"`, so the repo root is not an import path and
      # `import bartons` cannot resolve to the source tree. Same arrangement as
      # the wheel jobs' smoke step.
      - name: Smoke-test the sdist
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.tar.gz pytest
          python -c "import bartons; from bartons.indicators import KAMA; print('import ok')"
          python -m pytest -q

      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/*.tar.gz
