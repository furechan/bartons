# Publish to PyPI on a `v*` tag.
#
# Flow: verify the tag agrees with pyproject -> build everything through
# build.yml -> publish over OIDC. No API token exists anywhere; the publish job
# mints a short-lived PyPI credential from its GitHub identity, which is why it
# is the only job granted `id-token: write`.
#
# Release ritual. pyproject.toml already names the *next* release, plain, with no
# `.devN` suffix, so the tree is publishable at any time and nothing needs editing
# before a build (see CHANGELOG.md — a `.devN` scheme was tried first and dropped):
#   1. finalize the CHANGELOG heading for the version pyproject already carries
#   2. git tag -a v0.2.0 -m "0.2.0"        # must match pyproject, or `guard` fails
#   3. git push --follow-tags
#   4. after the publish job succeeds: `just bump`, then commit and push, so the
#      repo names the release after this one
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  # Runs before anything is built: a mismatch here is cheap to fix, but a tag
  # that has already been consumed by a build is not. These are the same two
  # remote-state checks `just release-guard` makes locally — the local recipe
  # adds clean-tree and upstream-sync, which CI satisfies by construction, and
  # this adds tag-matching, which has no local equivalent.
  guard:
    name: Verify tag and PyPI availability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare tag against pyproject, and check PyPI
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)

          # Tagging a commit that predates the version bump would otherwise
          # publish the older version under a tag claiming the newer one, and
          # PyPI can never be corrected — only superseded and yanked.
          [[ "$TAG" == "v$version" ]] || {
            echo "tag $TAG does not match pyproject version $version (expected v$version)" >&2
            echo "tag the release commit, not an earlier one" >&2
            exit 1
          }

          # /pypi/{name}/{version}/json is 404 until that version exists, so this
          # needs no parsing. Testing for == 404 also fails closed: a timeout or a
          # 5xx blocks the release rather than waving it through.
          code=$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/bartons/$version/json")
          [[ "$code" == 404 ]] || {
            echo "bartons $version is already on PyPI (HTTP $code) — bump the version" >&2
            exit 1
          }

          echo "ok: $TAG == v$version, not yet on PyPI"

  build:
    name: Build
    needs: guard
    uses: ./.github/workflows/build.yml
    # The one place the expensive macOS/Windows targets are non-negotiable.
    with:
      scope: full

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Gate: configure required reviewers on this environment if a pushed tag
    # alone should not be able to ship. The environment name must also match the
    # trusted publisher registered on PyPI.
    environment:
      name: pypi
      url: https://pypi.org/p/bartons
    permissions:
      # The whole authentication story. Lets the job mint the OIDC token it
      # trades for a 15-minute, project-scoped PyPI credential.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: List artifacts
        run: ls -l dist

      # No `password:` — the action performs the OIDC exchange itself.
      - uses: pypa/gh-action-pypi-publish@v1.14.2
