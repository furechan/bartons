[package]
name = "bartons"
# Deliberately 0.0.0 and never bumped. Cargo requires the field, but nothing
# reads it: this crate is a cdylib built only into the Python wheel, is not
# published to crates.io, and has no Rust dependents. The project version lives
# in ../pyproject.toml, which is what maturin stamps on the wheel. If the crate
# is ever published independently, this becomes real — revisit then.
version = "0.0.0"
edition = "2021"

[lib]
# The name of the native library. This is the name which will be used in Python to import the
# library (i.e. `import string_sum`). If you change this, you must also change the name of the
# `#[pymodule]` in `src/lib.rs`.
name = "plugin"
# "cdylib" is necessary to produce a shared library for Python to import from.
# Downstream Rust code (including code in `bin/`, `examples/`, and `tests/`) will not be able
# to `use string_sum;` unless the "rlib" or "lib" crate type is also included, e.g.:
# crate-type = ["cdylib", "rlib"]
crate-type= ["cdylib", "rlib"]

[[example]]
name = "fast-iter"
path = "../scripts/fast-iter.rs"

[[example]]
name = "fast-iter-bis"
path = "../scripts/fast-iter-bis.rs"

[[example]]
name = "izip-vs-index"
path = "../scripts/izip-vs-index.rs"

[features]
# Python wheels use the default: extension modules resolve Python symbols from
# the interpreter that loads them and therefore must not link libpython.
# Native Rust executables (tests, benches, examples) need the opposite linkage;
# build those with `cargo ... --no-default-features`.
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
itertools = "0.14"
serde = { version = "1", features = ["derive"] }

pyo3 = { version = "0.29", features = ["abi3-py311"] }
pyo3-polars = { version = "0.28", features = ["derive", "dtype-struct", "dtype-decimal", "dtype-array"] }

polars = { version = "0.55.1", features = ["dtype-struct"]}
polars-arrow = { version = "0.55.1", default-features = false }
