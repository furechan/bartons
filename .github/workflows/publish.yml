# Publish to PyPI the artifacts an earlier `build.yml` run already produced and
# smoke-tested. Nothing is built here.
#
# Two steps on purpose. A release that rebuilt would publish bits nobody looked
# at — and if anything landed on the branch meanwhile, bits compiled from
# different source than the ones inspected. Instead: build on demand, inspect
# what it made, then publish exactly those files.
#
# `dry_run` defaults to true, so the careless invocation is the harmless one:
#
#   gh workflow run publish.yml                    # resolve and report only
#   gh workflow run publish.yml -f dry_run=false   # actually publish
#
# No API token exists anywhere; the publish job mints a short-lived PyPI
# credential from its GitHub identity, which is why it is the only job granted
# `id-token: write`.
#
# Release ritual. pyproject.toml already names the *next* release, plain, with no
# `.devN` suffix, so the tree is publishable at any time and nothing needs editing
# before a build (see CHANGELOG.md — a `.devN` scheme was tried first and dropped):
#   1. finalize the CHANGELOG heading for the version pyproject already carries
#   2. gh workflow run build.yml -f scope=full        # builds and tests
#   3. gh run download <id> --dir /tmp/check          # inspect the real artifacts
#   4. gh workflow run publish.yml                    # dry run: what would ship
#   5. gh workflow run publish.yml -f dry_run=false   # publish
#   6. git tag -a v0.2.0 -m "0.2.0" && git push --follow-tags
#   7. `uv run inv bump`, then commit and push, so the repo names the release after this
name: Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Resolve and report only — do not publish"
        type: boolean
        default: true

permissions: {}

jobs:
  # Finds the build to publish, and refuses to name one that should not be.
  #
  # The artifacts carry no record of the commit they were compiled from, but
  # their run does. Resolve the newest successful full build whose `head_sha`
  # matches this dispatch, guaranteeing that it built this source and completed
  # every release target.
  guard:
    name: Resolve the build to publish
    runs-on: ubuntu-latest
    permissions:
      contents: read   # checkout, to read the version out of pyproject
      actions: read    # list other runs and their artifacts
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7

      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "releasing bartons $version from ${GITHUB_SHA:0:7}"

          found=$(gh api \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=20" \
            --jq '[.workflow_runs[] | select(.display_title == "Build (full)")][0].id // empty')

          [[ -n "$found" ]] || {
            echo "::error::no successful Build (full) run exists at ${GITHUB_SHA:0:7} — run: gh workflow run build.yml -f scope=full"
            exit 1
          }

          echo "run_id=$found" >> "$GITHUB_OUTPUT"
          {
            echo "### Ready to publish bartons $version"
            echo "- commit \`${GITHUB_SHA:0:7}\`, build run [\`$found\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$found)"
            echo "- artifacts: five platform wheels and the sdist from \`Build (full)\`"
            if [[ "${{ inputs.dry_run }}" == "true" ]]; then
              echo ""
              echo "Dry run — nothing was published. Rerun with \`-f dry_run=false\` to publish."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to PyPI
    needs: guard
    # Spelled `== false` rather than `!inputs.dry_run` so it fails safe. The
    # input only exists for a workflow_dispatch; on any other event it is null,
    # and `!null` is TRUE in GitHub expressions — so adding a tag or push
    # trigger later would silently arm an automatic upload. `null == false` is
    # false, so an unexpected event skips publishing instead.
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bartons
    permissions:
      # The whole authentication story. Lets the job mint the OIDC token it
      # trades for a 15-minute, project-scoped PyPI credential.
      id-token: write
      actions: read    # download artifacts belonging to another run
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
          run-id: ${{ needs.guard.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: List what will be uploaded
        run: ls -l dist

      # No `password:` — the action performs the OIDC exchange itself.
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          skip-existing: true
