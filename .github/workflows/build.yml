# Build distributable artifacts: wheels per (OS, arch) plus the sdist.
#
# `abi3-py311` is what keeps this small — a single cp311-abi3 wheel serves every
# Python 3.11+, so there is no Python axis, only platforms.
#
# COST. This is a private repo, so runner minutes are metered with per-OS
# multipliers: linux x1, windows x2, macOS x10. A full six-job matrix bills
# ~195 minutes, ~160 of it the two macOS jobs — so `full` is opt-in per dispatch
# and the default is the linux-only `scope`, which bills ~19.
#
# One trigger: workflow_dispatch — the button; pick `linux` or `full` by hand.
#
#   gh workflow run build.yml                    # linux only, ~19 billed minutes
#   gh workflow run build.yml -f scope=full      # all six targets, ~195
#   gh run list --workflow=build.yml --limit 1   # find the run id
#   gh run watch <run-id>
#   gh run download <run-id> --dir /tmp/check    # inspect the real artifacts
#
# A release needs the complete set, so it wants `scope=full`. The run name records
# that scope so publish.yml can select only successful full builds.
#
# There is intentionally no `workflow_call` either. A reusable workflow uploads
# its artifacts to the CALLER's run, which would put the wheels somewhere
# publish.yml never looks — it resolves a build by searching commit -> full run,
# and a called build has no run of its own to find. Re-adding a
# `uses:` would produce a pipeline that looks right and skips every provenance
# check. publish.yml publishes what a dispatched run already built; it does not
# build.
#
# There is intentionally NO push trigger. Pushing to main costs nothing; when you
# want a cross-platform check, press the button.
#
# A `pull_request` trigger existed (linux scope, filtered to packaging and
# compiled code) and was removed on 2026-08-21: every build is now something you
# asked for by name. The cost is that `workflow_dispatch` is read from the
# DEFAULT BRANCH, so a change to this file cannot be exercised until it is
# merged — there is no longer a pre-merge path that runs it.
name: Build
run-name: Build (${{ inputs.scope }})

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Which targets to build"
        type: choice
        options: [linux, full]
        default: linux

permissions: {}

concurrency:
  # Serialize runs on a ref without killing any: every run is now deliberate
  # (a dispatch or a release), and cancelling one would only waste the minutes
  # already spent. This was `github.event_name == 'pull_request'`, which can no
  # longer be true.
  group: wheels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wheel-linux:
    name: ${{ matrix.name }}
    # `permissions: {}` above zeroes the token for every job, and
    # actions/checkout clones with it — without this the checkout 403s on a
    # private repo.
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # manylinux 2_28 rather than the runner's own glibc: building on the
          # host would needlessly exclude older distributions.
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64
            manylinux: "2_28"
          # Native ARM64 makes this wheel testable like every other artifact.
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2_28"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --compatibility pypi --out dist
          sccache: "true"

      # A wheel that builds but cannot be imported is the failure this matrix
      # exists to catch, so install from the wheel — not the source tree — and run
      # the suite against the artifact that would actually ship.
      - name: Smoke-test the wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl pytest
          python -m pytest -q

      # Retention is a release deadline, not just a quota knob: publish.yml
      # publishes a PREVIOUS run's artifacts and refuses any that have expired,
      # so this is how long a build stays publishable. 30 days is a generous
      # window that still needs ~15 full matrices in a month to press the 500 MB
      # Free storage quota (a full run is ~33 MB).
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.name }}
          path: dist/*.whl
          retention-days: 30

  # These expensive targets run only for an explicitly requested full build.
  wheel-full:
    name: ${{ matrix.name }}
    if: ${{ inputs.scope == 'full' }}
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            manylinux: auto
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: auto
          - name: windows-x64
            runner: windows-latest
            target: x64
            manylinux: auto
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --compatibility pypi --out dist
          sccache: "true"

      - name: Smoke-test the wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl pytest
          python -m pytest -q

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.name }}
          path: dist/*.whl
          retention-days: 30

  sdist:
    name: sdist
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The fallback for platforms with no wheel. Installing from it needs a Rust
      # toolchain on the user's machine, which pyproject cannot declare — hence
      # the wheel matrix above.
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          command: sdist
          args: --out dist

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # The sdist is the artifact most likely to break silently: it ships only
      # what the packaging config selects, so a file left out still compiles here
      # and fails on a stranger's machine. Installing it exercises the real path
      # — cargo builds the extension from the included sources — which no wheel
      # job covers and `twine check` cannot see, validating only metadata.
      #
      # The suite comes from the checkout, not the sdist, which ships no tests.
      # It still exercises the *installed* build: pyproject sets
      # `python-source = "python"`, so the repo root is not an import path and
      # `import bartons` cannot resolve to the source tree. Same arrangement as
      # the wheel jobs' smoke step.
      - name: Smoke-test the sdist
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.tar.gz pytest
          python -m pytest -q

      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          retention-days: 30
