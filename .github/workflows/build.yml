# Build, test, and verify one complete Bartons release artifact set.
name: Build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64
            manylinux: "2_28"
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2_28"
          - name: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            manylinux: auto
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: auto
          - name: windows-x64
            runner: windows-latest
            target: x64
            manylinux: auto
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --compatibility pypi --out dist
          sccache: "true"

      - name: Smoke-test wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl pytest
          python -m pytest -q

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          command: sdist
          args: --out dist

      - name: Smoke-test sdist
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.tar.gz pytest
          python -m pytest -q

      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  verify:
    name: Verify release artifacts
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Verify artifact set
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          [[ ${#wheels[@]} -eq 5 ]] || {
            echo "::error::expected 5 wheels, found ${#wheels[@]}"
            exit 1
          }
          [[ ${#sdists[@]} -eq 1 ]] || {
            echo "::error::expected 1 sdist, found ${#sdists[@]}"
            exit 1
          }
          printf '%s\n' "${wheels[@]}" "${sdists[@]}"
