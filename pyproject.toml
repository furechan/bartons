# See https://www.maturin.rs/config.html

[build-system]
build-backend = "maturin"
requires = ["maturin>=1.0,<2.0"]

# Project name must match python package name
# unless `tools.maturin.python-packages` is defined

[project]
name = "bartons"
version = "0.1.0"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    # Widened compatibility window, verified by the noxfile `compat` matrix: the plugin
    # (built against crate 0.54.4) runs correctly on every polars engine in this range via
    # the stable FFI (0,1) + Arrow C boundary. See docs/polars-ffi-version-table.md and
    # docs/polars-ffi-version-guard.md. (Upper bound is the current test ceiling, not a hard
    # ABI limit — extend as newer polars is verified.)
    "polars>=1.0,<1.43",
]

[dependency-groups]
dev = [
    "maturin",
    "pytest",
    "nox",
    "build",
    "pyarrow",
    "ipykernel",
    "invoke",
    "numpy>=2.2.6",
    "patchelf>=0.17.2.4",
    # Benchmark-only: comparison baseline in scripts/benchmark-ema.py.
    # Needs the TA-Lib C library at runtime (e.g. `apt-get install libta-lib0`).
    "polars-talib>=0.1.5",
    "mintalib>=0.0.35",
]


[tool.maturin]
python-source = "python"
python-packages = ["bartons"]
module-name = "bartons.plugin"
manifest-path = "bartons/Cargo.toml"

# When using a custom module name the name must defined with `tool.maturin.module`
# The module name match the rust module name in libs.rs with either
# - the #[pymodule] function definition
# - the the #[pyo3(name = "...")] directive

[tool.pytest.ini_options]
addopts = ["-p no:cacheprovider"]
testpaths = ["tests"]

