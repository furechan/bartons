# See https://www.maturin.rs/config.html

[build-system]
build-backend = "maturin"
requires = ["maturin>=1.0,<2.0"]

# Project name must match python package name
# unless `tools.maturin.python-packages` is defined

[project]
name = "bartons"
version = "0.1.0"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    # Compatibility window verified by the noxfile `compat` matrix: the plugin
    # (built against crate 0.54.4) runs correctly on every polars engine in this range via
    # the stable FFI (0,1) + Arrow C boundary. See docs/polars-ffi-version-table.md and
    # docs/polars-ffi-version-guard.md. (Upper bound is the current test ceiling, not a hard
    # ABI limit — extend as newer polars is verified.)
    #
    # Lower bound is 1.28, not 1.0: the eager `bartons.plugin.<name>` pyfunctions marshal a
    # Series into Rust via pyo3-polars 0.27, which calls the private `PySeries._export` —
    # only present from polars 1.28. On older engines those calls raise
    # `AttributeError: 'PySeries' object has no attribute '_export'`. The expression path
    # (`EMA()`, `.bt.ema()`) needs no `_export` and would work on older polars, but the
    # package floors at 1.28 so its whole public API is usable; the `compat` matrix tests
    # `[1.28, 1.43)`. See docs/test-compat-helpers.md.
    "polars>=1.28,<1.43",
]

[dependency-groups]
dev = [
    "maturin",
    "pytest",
    "nox",
    "build",
    "pyarrow",
    "ipykernel",
    "invoke",
    "numpy>=2.2.6",
    "patchelf>=0.17.2.4",
    # Benchmark-only: comparison baselines in scripts/benchmark-*.py.
    # `ta-lib` bundles its own libta-lib C library in the wheel; preloading it
    # (RTLD_GLOBAL) also resolves polars-talib's undefined TA_* symbols, so no
    # system libta-lib install is required.
    "polars-talib>=0.1.5",
    "ta-lib>=0.6.7",
    "mintalib>=0.0.35",
]

# Only needed to refresh the bundled sample prices via scripts/update-samples.py.
# Kept out of the default dev sync; install with `uv sync --group samples`.
samples = [
    "pandas",
    "yfinance",
]


[tool.maturin]
python-source = "python"
python-packages = ["bartons"]
module-name = "bartons.plugin"
manifest-path = "bartons/Cargo.toml"
# Bundled sample-price CSVs are data, not Python — list them so maturin ships
# them in both the sdist and the wheel.
include = [
    { path = "python/bartons/samples/*-prices.csv", format = ["sdist", "wheel"] },
]

# When using a custom module name the name must defined with `tool.maturin.module`
# The module name match the rust module name in libs.rs with either
# - the #[pymodule] function definition
# - the the #[pyo3(name = "...")] directive

[tool.pytest.ini_options]
addopts = ["-p no:cacheprovider"]
testpaths = ["tests"]

