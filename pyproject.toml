# See https://www.maturin.rs/config.html

[build-system]
build-backend = "maturin"
requires = ["maturin>=1.9,<2.0"]

# Project name must match python package name
# unless `tools.maturin.python-packages` is defined

[project]
name = "bartons"
# The one authoritative version for the project. Only the Python distribution is
# published; the crate's own `version` is unused and stays at 0.0.0. Bump here.
#
# The default branch carries the next patch development version. `inv release`
# removes `.dev0`, commits and tags that release, pushes it, then advances main
# to the following patch's `.dev0` version in a second commit and push.
version = "0.1.7.dev0"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.txt"]
description = "Financial and technical-analysis expressions for Polars, implemented in Rust"
readme = "README.md"
authors = [{ name = "Furechan", email = "furechan@xsmail.com" }]
keywords = [
  "polars",
  "technical-analysis",
  "indicators",
  "finance",
  "quantitative-finance",
  "rust",
]
# No "License :: OSI Approved :: MIT License" classifier: PEP 639 deprecates the
# license classifiers in favour of the `license` field above, and the two must not
# be combined once a backend emits `License-Expression`.
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Topic :: Office/Business :: Financial :: Investment",
  "Programming Language :: Rust",
  # No per-minor entries: `requires-python` is what pip enforces, and each
  # classifier would be a claim to keep current.
  "Programming Language :: Python :: 3",
  # CPython only, and not by omission: the wheels are `cp311-abi3`, and PyPy has
  # no stable ABI for pyo3 to build against.
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    # Supported polars-py range, verified by the noxfile `compat` matrix: the plugin
    # (built against polars-rs 0.55.2) runs correctly on every engine in this range via
    # the stable FFI (0,1) + Arrow C boundary. See docs/polars-ffi-version-table.md and
    # notes/maintenance/polars-ffi-version-guard.md. The ceiling is the current test boundary, not a
    # hard ABI limit — raise it with `uv run inv raise-ceiling`, which tests the newest
    # polars-py and only moves the number if it passes.
    #
    # The floor is 1.28, not 1.0: the eager `bartons.kernels.<name>` pyfunctions marshal a
    # Series into Rust via pyo3-polars 0.27, which calls the private `PySeries._export` —
    # only present from polars 1.28. On older engines those calls raise
    # `AttributeError: 'PySeries' object has no attribute '_export'`. The expression path
    # (`EMA()`) needs no `_export` and would work on older polars, but the
    # package floors at 1.28 so its whole public API is usable; the `compat` matrix tests
    # `[1.28, 1.44)`. See notes/maintenance/test-compat-helpers.md.
    "polars>=1.28,<1.44",
]

[project.urls]
Homepage = "https://github.com/furechan/bartons"
Source = "https://github.com/furechan/bartons"
Issues = "https://github.com/furechan/bartons/issues"
Changelog = "https://github.com/furechan/bartons/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "maturin>=1.9",
    "pytest",
    "nox",
    "build",
    "pyarrow",
    "ipykernel",
    "numpy>=2.2.6",
    "patchelf>=0.17.2.4",
    # Benchmark-only: comparison baselines in scripts/benchmark-*.py.
    # `ta-lib` bundles its own libta-lib C library in the wheel; preloading it
    # (RTLD_GLOBAL) also resolves polars-talib's undefined TA_* symbols, so no
    # system libta-lib install is required.
    "polars-talib>=0.1.6",
    "ta-lib>=0.6.7",
    "mintalib>=0.0.35",
    "fsdata>=0.0.9",
    "invoke>=3.0.3",
    "altair>=6.2.2",
    "vl-convert-python>=1.9.0.post1",
]

# Only needed to refresh the bundled sample prices via scripts/update-samples.py.
# Kept out of the default dev sync; install with `uv sync --group samples`.
samples = [
    "pandas",
    "yfinance",
]


[tool.maturin]
python-source = "python"
python-packages = ["bartons"]
module-name = "bartons.kernels"
manifest-path = "bartons/Cargo.toml"
compatibility = "pypi"
# Bundled sample-price CSVs are data, not Python — list them so maturin ships
# them in both the sdist and the wheel.
include = [
    # PEP 639 metadata names this file explicitly. Maturin does not otherwise
    # copy a license beside a nested Cargo manifest into the sdist root, and
    # PyPI rejects an archive whose declared License-File is absent.
    { path = "LICENSE.txt", format = "sdist" },
    { path = "python/bartons/samples/*-prices.csv", format = ["sdist", "wheel"] },
]

# When using a custom module name the name must defined with `tool.maturin.module`
# The module name match the rust module name in libs.rs with either
# - the #[pymodule] function definition
# - the the #[pyo3(name = "...")] directive

[tool.ty.src]
# `evcxr/` holds Rust prototyping notebooks — .ipynb files whose kernelspec is
# `language = "rust"`. ty parses any .ipynb as Python, so every Rust cell in
# them lands as a syntax error, drowning the real diagnostics.
# The sample refresh utility belongs to the optional `samples` dependency group;
# the default development environment intentionally does not install pandas.
exclude = ["evcxr", "scripts/update-samples.py"]

[tool.pytest.ini_options]
addopts = ["-p no:cacheprovider"]
testpaths = ["tests"]
